:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19303b;background:#f2f5f6;line-height:1.55;--teal:#097e88;--slate:#596579;--ink:#19303b;--border:#d6dfe3;--light:#f5f8f9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e7ad38;outline-offset:2px}a{color:#096977}header{background:#123a48;color:white;padding:21px 20px}header .head{max-width:1090px;margin:auto;display:flex;align-items:center;gap:15px}header .logo{font-size:34px}header h1{font-size:1.47rem;line-height:1.2;margin:0}header p{margin:4px 0 0;color:#d8e7e9;font-size:.91rem}.shell{max-width:1090px;margin:26px auto 65px;padding:0 16px}.progress{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-bottom:20px}.progress button{border:1px solid var(--border);border-radius:11px;background:white;padding:12px 5px;color:#405361;font-size:.78rem;font-weight:650}.progress button.active{background:#d8edef;border-color:#4a9ca3;color:#084f57}.progress button .n{display:block;font-size:1rem}.panel{background:white;border:1px solid var(--border);border-radius:18px;padding:28px 32px;box-shadow:0 12px 30px #1d43500a}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#176d76;font-size:.75rem;margin:0 0 4px}h2{font-size:1.65rem;margin:0 0 12px;line-height:1.25}h3{font-size:1.14rem;margin:10px 0}p{margin:9px 0 13px}.muted{color:#546574}.small{font-size:.88rem}.hint{padding:13px 16px;background:#edf6f6;border-left:4px solid #2d8991;border-radius:8px;margin:15px 0}.warning{background:#fff4dd;border-left-color:#aa7822}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--border);border-radius:13px;padding:17px;background:#fff}.card.alt{background:var(--light)}label{font-weight:700;display:block;margin:11px 0 5px}input[type=text],textarea,select{width:100%;border:1px solid #9daeb7;border-radius:9px;padding:10px 12px;background:white;color:#172d38}textarea{min-height:78px;resize:vertical}input[type=range]{width:100%;accent-color:#087b84}.scale-labels{display:flex;justify-content:space-between;font-size:.82rem;gap:8px;color:#4a5a67}.scale-labels span:last-child{text-align:right}.range-center{text-align:center;font-weight:700;color:#1e6370;padding:6px}.btn{background:#126b75;color:white;border:0;padding:11px 19px;border-radius:10px;font-weight:750}.btn:hover{background:#0b525b}.btn.secondary{color:#1b5260;background:#e5f0f1}.btn.outline{color:#2d5160;background:white;border:1px solid #8aa5ae}.btn.danger{background:#f6ebec;color:#873542}.btn:disabled{opacity:.45;cursor:not-allowed}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:23px}.nav .btn:last-child{margin-left:auto}.choice{display:flex;align-items:center;gap:7px;background:white;padding:9px 11px;border:1px solid var(--border);border-radius:10px;cursor:pointer;flex:1;min-width:140px}.choice input{accent-color:#087b84}.arg{background:#f8fafb;border:1px solid var(--border);border-radius:11px;padding:13px;margin-top:12px}.arg .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.arg .top strong{font-size:.88rem}.arg .mini{background:none;border:0;text-decoration:underline;color:#86515a;font-size:.81rem;padding:5px}.arg .row label{margin:0;font-weight:550;font-size:.87rem}.arg .row{margin:8px 0}.arg .row select{max-width:270px}.field-note{font-size:.8rem;color:#60707c}.criterion{margin:0 0 14px}.criterion summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px;background:#f4f8f9;border-radius:10px;font-weight:720}.criterion summary::marker{content:''}.criterion summary span{font-size:.83rem;color:#4e6572;font-weight:500}.criterion .inner{padding:15px 12px;border:1px solid var(--border);border-top:0;border-radius:0 0 12px 12px}.criterion[open] summary{border-radius:10px 10px 0 0}.waage-wrap{background:#f6f9fa;border:1px solid var(--border);border-radius:14px;padding:15px;text-align:center}.waage-wrap svg{width:min(100%,430px);height:auto}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{border-radius:10px;padding:11px;text-align:center;background:#dceff0}.score.contra{background:#e7ebf1}.score strong{display:block;font-size:1.25rem}.bar-track{height:19px;background:#e0e7eb;border-radius:99px;display:flex;overflow:hidden}.bar-pro{background:var(--teal);transition:width .3s}.bar-contra{background:var(--slate);transition:width .3s}.qcard{background:#f5f8fa;border:1px solid var(--border);border-radius:11px;padding:16px;margin:14px 0}.qcard strong{color:#186c74}.qcard textarea{background:white}.report-box{background:#f8fafb;border:1px solid var(--border);padding:18px;border-radius:13px;margin:15px 0}.tag{display:inline-block;padding:2px 9px;background:#e6f2f2;color:#115d65;font-size:.8rem;border-radius:99px;font-weight:750}.hide{display:none!important}footer{text-align:center;color:#63717b;margin:30px auto;max-width:850px;font-size:.8rem}.print-report{display:none}.pill{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--light)}.fieldline{margin-top:5px;color:#586976;font-size:.8rem}ul.tight{margin:8px 0;padding-left:21px}ul.tight li{margin:5px 0}.position-result{text-align:center;font-size:1.08rem;font-weight:750;color:#12636b}.message{color:#8b430a;background:#fff1dd;padding:10px 12px;border-radius:10px;margin-top:8px}#steps-content{min-height:420px}@media(max-width:700px){.grid2{grid-template-columns:1fr}.progress{grid-template-columns:repeat(3,1fr)}.panel{padding:20px 16px}h2{font-size:1.34rem}.shell{margin-top:13px}.scores{gap:5px}.score{padding:7px}.criterion summary{display:block}}@media print{@page{size:A4;margin:15mm}body{background:white;font-size:10.5pt;color:#000}header,.shell,footer{display:none!important}.print-report{display:block!important;padding:0}.print-report h1{font-size:19pt;margin:0}.print-report h2{font-size:13pt;margin:14pt 0 5pt;border-bottom:1px solid #aaa}.print-report h3{font-size:11pt;margin:9pt 0 3pt}.print-report p{margin:4pt 0;white-space:pre-wrap}.print-report table{width:100%;border-collapse:collapse;font-size:9pt}.print-report th,.print-report td{border:1px solid #bbb;padding:5pt;text-align:left;vertical-align:top}.print-report .entry{break-inside:avoid;margin-bottom:8pt}.print-report .foot{font-size:8pt;color:#555;border-top:1px solid #aaa;margin-top:16pt;padding-top:6pt}}

<body>
<header><div class="head"><div class="logo" aria-hidden="true">⚖</div><div><h1>Die digitale Werte-Waage</h1><p>Mein begründetes Urteil · AfD-Parteiverbotsverfahren</p></div></div></header>
<main class="shell"><nav class="progress" aria-label="Lernschritte" id="progress"></nav><section class="panel" id="steps-content" aria-live="polite"></section><footer>Deine Eingaben bleiben in dieser Browserseite und werden nicht an einen Server gesendet. Keine Anmeldung, keine automatische politische Bewertung. „PDF erstellen“ nutzt die Druckfunktion deines Browsers.</footer></main>
<section id="printReport" class="print-report"></section>
<script>
'use strict';
const state={step:0,initial:0,final:0,criteria:Array.from({length:8},(_,i)=>({type:i<4?'S':'W',name:'',importance:3,arguments:[]})),answers:[],judgment:'',change:'',showPrint:false};
const steps=['Ausgangsposition','Kriterien','Werte-Waage','Rückfragen','Mein Urteil','Ergebnis'];
const root=document.getElementById('steps-content');const $=(tag,cls,text)=>{let el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
const el=(tag,attrs={},children=[])=>{let e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='value')e.value=v;else e.setAttribute(k,v)});children.forEach(x=>e.append(x));return e};
const add=(p,...elements)=>elements.forEach(x=>p.append(x));const text=(p,t,cls='')=>add(p,$('p',cls,t));
function btn(txt,fn,klass='btn'){const b=$('button',klass,txt);b.type='button';b.addEventListener('click',fn);return b}
function heading(num,title,desc){text(root,'Schritt '+(num+1)+' von 6','eyebrow');add(root,$('h2','',title));if(desc)text(root,desc,'muted')}
function inputText(val,cb,placeholder='',multiline=false){let i=$(multiline?'textarea':'input');if(!multiline)i.type='text';i.value=val;i.placeholder=placeholder;i.addEventListener('input',()=>cb(i.value));return i}
function range(min,max,value,onChange){let e=$('input');e.type='range';e.min=min;e.max=max;e.step=1;e.value=value;e.addEventListener('input',()=>onChange(Number(e.value)));return e}
function lbl(str){return $('label','',str)}
function select(options,value,onChange){let x=$('select');options.forEach(([v,t])=>{let o=$('option','',t);o.value=v;x.append(o)});x.value=value;x.addEventListener('change',()=>onChange(x.value));return x}
function nav(prev,next,nextName='Weiter'){let wrap=$('div','nav');if(prev!==null)add(wrap,btn('← Zurück',()=>go(prev),'btn secondary'));if(next!==null)add(wrap,btn(nextName+' →',()=>go(next)));add(root,wrap)}
function renderProgress(){const prog=document.getElementById('progress');prog.replaceChildren();steps.forEach((s,i)=>{let b=$('button',i===state.step?'active':'');add(b,$('span','n',String(i+1)),document.createTextNode(s));b.setAttribute('aria-current',i===state.step?'step':'false');b.addEventListener('click',()=>go(i));prog.append(b)})}
function go(s){state.step=s;render();window.scrollTo({top:0,behavior:'instant'})}
function init(){heading(0,'Wo stehe ich zunächst?','Eine erste Position ist noch kein begründetes Urteil. Du darfst unentschieden sein – und deine Position später ändern.');let box=$('div','card alt');add(box,lbl('Soll gegen die AfD ein Parteienverbotsverfahren eingeleitet werden?'));let result=$('div','range-center');add(box,range(-3,3,state.initial,v=>{state.initial=v;result.textContent=position(v)}),el('div',{class:'scale-labels'},[$('span','', 'Klar dafür'),$('span','','Unentschieden'),$('span','','Klar dagegen')]),result);result.textContent=position(state.initial);add(root,box);let hint=$('div','hint');hint.textContent='Du entscheidest über die Einleitung eines Verfahrens – nicht über ein sofortiges Verbot. Nur das Bundesverfassungsgericht könnte die Partei bei erfüllten Voraussetzungen verbieten.';add(root,hint);text(root,'Für deine Argumente und Werte bist du selbst verantwortlich. Die Anwendung stellt Fragen, trifft aber keine Entscheidung für dich.');nav(null,1)}
function position(v){return v===0?'Unentschieden':Math.abs(v)===3?'Klar '+(v<0?'für':'gegen')+' ein Verfahren': 'Eher '+(v<0?'für':'gegen')+' ein Verfahren'}
function criteria(){heading(1,'Meine acht Urteilskriterien','Trage die vier Sach- und vier Werturteilskriterien ein, die ihr im Unterricht erarbeitet habt. Die Anwendung schlägt bewusst keine vor.');for(let type of ['S','W']){add(root,$('h3','',type==='S'?'Sachurteil: vier Kriterien':'Werturteil: vier Kriterien'));const grid=$('div','grid2');state.criteria.forEach((c,i)=>{if(c.type!==type)return;let cell=$('div','');add(cell,lbl(type+(i%4+1)),inputText(c.name,v=>{c.name=v},'Hier euer Kriterium eintragen'));grid.append(cell)});add(root,grid)}add(root,el('div',{class:'hint',text:'Sachurteile prüfen Informationen und wahrscheinliche Folgen; Werturteile legen offen, welche demokratischen Werte für dich wichtig sind.'}));nav(0,2)}
function totals(){let P=0,C=0,per=[];state.criteria.forEach((c,i)=>{let pro=c.arguments.filter(a=>a.direction==='pro'&&a.body.trim());let contra=c.arguments.filter(a=>a.direction==='contra'&&a.body.trim());const avg=a=>a.length?a.reduce((s,x)=>s+x.strength,0)/a.length:0;let p=avg(pro)*c.importance,con=avg(contra)*c.importance;P+=p;C+=con;per.push({i,name:c.name||'Kriterium '+(i+1),type:c.type,pro:p,contra:con})});return {P,C,per}}
function balanceVisual(){let {P,C}=totals();let sum=P+C;let tilt=sum?Math.max(-13,Math.min(13,(C-P)/sum*13)):0;let outer=$('div','waage-wrap');let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 440 250');svg.setAttribute('role','img');svg.setAttribute('aria-label','Waage mit Pro und Kontra. Die Darstellung gibt nur deine eigenen Gewichtungen wieder.');svg.innerHTML='<path d="M168 222 L272 222 L256 206 L184 206 Z" fill="#92a3af"/><rect x="215" y="45" width="10" height="161" rx="4" fill="#718895"/><circle cx="220" cy="46" r="12" fill="#527b83"/><g id="beam"><path d="M83 46 L357 46" stroke="#4c6875" stroke-width="9" stroke-linecap="round"/><path d="M83 46 L54 151 M83 46 L112 151 M357 46 L328 151 M357 46 L386 151" stroke="#91a3af" stroke-width="3" fill="none"/><path d="M38 151 Q83 190 128 151 Z" fill="#17838c"/><path d="M312 151 Q357 190 402 151 Z" fill="#798798"/></g><text x="83" y="207" text-anchor="middle" fill="#0d6d77" font-size="17" font-weight="700">PRO</text><text x="357" y="207" text-anchor="middle" fill="#596579" font-size="17" font-weight="700">KONTRA</text>';svg.querySelector('#beam').setAttribute('transform','rotate('+tilt+' 220 46)');outer.append(svg);const cards=$('div','scores');const p=$('div','score');const c=$('div','score contra');add(p,$('span','','Pro-Gewichtung'),$('strong','',P.toFixed(1).replace('.',',')));add(c,$('span','','Kontra-Gewichtung'),$('strong','',C.toFixed(1).replace('.',',')));add(cards,p,c);add(outer,cards);let track=$('div','bar-track');let a=$('div','bar-pro'),b=$('div','bar-contra');a.style.width=(sum?P/sum*100:50)+'%';b.style.width=(sum?C/sum*100:50)+'%';add(track,a,b);add(outer,track);text(outer,'Die Anzeige misst keine politische Wahrheit. Gleiche Argumente werden innerhalb eines Kriteriums gemittelt statt einfach aufaddiert.','fieldline');return outer}
function argumentsScreen(){heading(2,'Argumente auf die Waage legen','Du legst die Richtung und Stärke der Argumente fest. Die Bedeutung jedes Kriteriums bestimmst ebenfalls du.');let missing=state.criteria.filter(x=>!x.name.trim()).length;if(missing)add(root,el('div',{class:'hint warning',text:'Noch '+missing+' Kriterienfelder sind leer. Du kannst sie im vorherigen Schritt ergänzen.'}));let container=$('div','grid2');let column=$('div');add(column,$('h3','','Meine Abwägung'),balanceVisual());let info=$('div','hint');info.textContent='Tragfähigkeit: Wie überzeugend ist die Begründung? Wichtigkeit: Wie bedeutsam ist das Kriterium für dein Gesamturteil? Unklare Argumente werden erfasst, aber nicht als Pro- oder Kontra-Punkte gezählt.';add(column,info);let editor=$('div');add(editor,$('h3','','Kriterien und Argumente'));state.criteria.forEach((c,i)=>{let detail=$('details','criterion');if(i===state.activeCriterion)detail.open=true;let summary=$('summary');add(summary,$('strong','',c.type+(i%4+1)+' · '+(c.name.trim()||'Kriterium noch nicht eingetragen')),$('span','',c.arguments.length+' Argument(e)'));detail.append(summary);detail.addEventListener('toggle',()=>{if(detail.open)state.activeCriterion=i});let inner=$('div','inner');add(inner,lbl('Wichtigkeit dieses Kriteriums (1–5)'));let status=$('div','fieldline','Bedeutung: '+c.importance+' von 5');add(inner,range(1,5,c.importance,v=>{c.importance=v;status.textContent='Bedeutung: '+v+' von 5';refreshBalance()}),status);c.arguments.forEach((a,j)=>{let div=$('div','arg');let top=$('div','top');add(top,$('strong','', 'Argument '+(j+1)),btn('Entfernen',()=>{c.arguments.splice(j,1);render()},'mini'));add(div,top,lbl('Argument oder Überlegung'),inputText(a.body,v=>{a.body=v;refreshBalance()},'Formuliere einen konkreten Gesichtspunkt …',true),lbl('Beleg / Begründung (optional, empfohlen)'),inputText(a.evidence,v=>{a.evidence=v},'Welche überprüfbare Information oder Begründung spricht dafür?',true),lbl('Richtung'),select([['pro','Eher für das Verfahren'],['contra','Eher gegen das Verfahren'],['unclear','Unklar / offen']],a.direction,v=>{a.direction=v;refreshBalance()}),lbl('Tragfähigkeit (1–5)'));let strength=$('div','fieldline','Tragfähigkeit: '+a.strength+' von 5');add(div,range(1,5,a.strength,v=>{a.strength=v;strength.textContent='Tragfähigkeit: '+v+' von 5';refreshBalance()}),strength);inner.append(div)});add(inner,btn('+ Argument ergänzen',()=>{c.arguments.push({body:'',evidence:'',direction:'unclear',strength:3});state.activeCriterion=i;render()},'btn outline'));add(detail,inner);editor.append(detail)});add(container,editor,column);add(root,container);const tip=$('div','hint');tip.textContent='Tipp: Zwei belegte Sachargumente und eine erkennbare Wertabwägung reichen als guter Anfang. Du kannst später alles überarbeiten.';add(root,tip);nav(1,3)}
function refreshBalance(){let main=document.querySelector('.waage-wrap');if(main)main.replaceWith(balanceVisual())}
function buildQuestions(){const all=state.criteria.flatMap((c,i)=>c.arguments.map(a=>({c,i,a}))).filter(x=>x.a.body.trim());let q=[];let weak=all.filter(x=>x.c.type==='S'&&x.a.direction!=='unclear'&&!x.a.evidence.trim()).sort((x,y)=>y.a.strength-x.a.strength)[0];if(weak)q.push({type:'Belegprüfung',text:'Du gewichtest beim Kriterium „'+(weak.c.name||'S'+(weak.i+1))+'“ ein Argument. Welcher überprüfbare Beleg könnte deine Einschätzung stützen oder widerlegen?'});else q.push({type:'Belegprüfung',text:'Welche überprüfbare Information hat dein Sachurteil am stärksten geprägt? Wie sicher bist du dir dabei?'});let values=state.criteria.filter(c=>c.type==='W'&&c.name.trim()).sort((a,b)=>b.importance-a.importance);q.push({type:'Wertabwägung',text:values.length>=2?'Wie verhält sich der Wert „'+values[0].name+'“ zum Wert „'+values[1].name+'“? Warum gewichtest du sie so?':'Welche demokratischen Werte geraten in deiner Entscheidung in Spannung, und welcher ist für dich wichtiger?'});let d=totals();q.push({type:'Perspektivwechsel',text:d.P>d.C?'Welches ist das stärkste Argument gegen die Einleitung eines Verbotsverfahrens – und wie gehst du damit um?':d.C>d.P?'Welches ist das stärkste Argument für die Einleitung eines Verbotsverfahrens – und wie gehst du damit um?':'Welches Argument würde eine Person mit einer anderen Position als du vermutlich hervorheben?'});q.push({type:'Unsicherheit',text:'Welche neue Information oder welche Entwicklung könnte dich dazu bringen, dein Urteil zu überdenken?'});return q}
function questions(){heading(3,'Mein Urteil auf dem Prüfstand','Vier Rückfragen helfen dir, Belege, Wertkonflikte und Gegenargumente zu prüfen. Du kannst deine Gewichtungen anschließend korrigieren.');let q=buildQuestions();q.forEach((x,i)=>{let box=$('div','qcard');add(box,$('strong','',x.type),$('p','',x.text),inputText(state.answers[i]||'',v=>{state.answers[i]=v},'Deine Überlegungen …',true));root.append(box)});text(root,'Die Fragen werden anhand deiner Eintragungen ausgewählt. Eine automatische Überprüfung frei formulierter Fakten findet nicht statt.','small muted');nav(2,4)}
function judgment(){heading(4,'Mein Sach- und Werturteil','Formuliere selbst dein Gesamturteil. Die Formulierungshilfen kannst du nutzen, verändern oder weglassen.');let box=$('div','card alt');add(box,$('h3','','Kurze Sprechvorlage'));['Ich stehe hier, weil …','Sachlich spricht für mein Urteil, dass …','Besonders wichtig ist mir der Wert …, weil …','Obwohl …, komme ich insgesamt zu dem Urteil, dass …'].forEach(x=>add(box,$('p','', '„'+x+'“')));root.append(box);let t=totals();let r=$('div','hint');r.textContent='Die Waage zeigt Pro '+t.P.toFixed(1)+' / Kontra '+t.C.toFixed(1)+'. Sie muss nicht mit deinem Urteil übereinstimmen. Falls du anders entscheidest, erläutere warum.';add(root,r,lbl('Mein begründetes Gesamturteil'),inputText(state.judgment,v=>state.judgment=v,'Schreibe dein Urteil in eigenen Worten …',true));add(root,$('h3','','Meine Schlussposition'));let res=$('div','position-result',position(state.final));add(root,range(-3,3,state.final,v=>{state.final=v;res.textContent=position(v)}),el('div',{class:'scale-labels'},[$('span','','Klar dafür'),$('span','','Unentschieden'),$('span','','Klar dagegen')]),res);add(root,lbl('Rückblick: Was hat deine Position gefestigt oder verändert?'),inputText(state.change,v=>state.change=v,'Ich habe … besonders gewichtet / neu verstanden …',true));nav(3,5,'Ergebnis ansehen')}
function reportText(){let r=[];r.push('DIE DIGITALE WERTE-WAAGE – MEIN URTEIL');r.push('Frage: Soll gegen die AfD ein Parteienverbotsverfahren eingeleitet werden?');r.push('Ausgangsposition: '+position(state.initial));r.push('Schlussposition: '+position(state.final));r.push('');state.criteria.forEach((c,i)=>{r.push(c.type+(i%4+1)+' '+(c.name||'(nicht ausgefüllt)')+' | Wichtigkeit '+c.importance+'/5');c.arguments.forEach(a=>r.push(' – '+(a.direction==='pro'?'PRO':a.direction==='contra'?'KONTRA':'OFFEN')+' ('+a.strength+'/5): '+a.body+(a.evidence?' | Beleg/Begründung: '+a.evidence:'')))});r.push('');buildQuestions().forEach((q,i)=>r.push(q.type+': '+q.text+'\nAntwort: '+(state.answers[i]||'(offen)')));r.push('\nMein Gesamturteil:\n'+(state.judgment||'(offen)'));r.push('\nMein Rückblick:\n'+(state.change||'(offen)'));return r.join('\n')}
function safeContent(parent,title,body){add(parent,$('h3','',title),$('p','',body||'—'))}
function buildPrint(){let root=document.getElementById('printReport');root.replaceChildren();add(root,$('h1','','Die Werte-Waage · Mein politisches Urteil'),$('p','','Soll gegen die AfD ein Parteienverbotsverfahren eingeleitet werden?'));add(root,$('p','','Ausgangsposition: '+position(state.initial)+' · Schlussposition: '+position(state.final)));add(root,$('h2','','Meine Urteilskriterien und Argumente'));for(let type of ['S','W']){add(root,$('h3','',type==='S'?'Sachurteil':'Werturteil'));let table=$('table');let head=$('tr');['Kriterium / Wichtigkeit','Argumente und ihre Tragfähigkeit'].forEach(x=>head.append($('th','',x)));table.append(head);state.criteria.forEach((c,i)=>{if(c.type!==type)return;let row=$('tr');let first=$('td','',c.type+(i%4+1)+' '+(c.name||'–')+'\nWichtigkeit: '+c.importance+'/5');let second=$('td');if(!c.arguments.length)second.textContent='Keine Argumente eingegeben';c.arguments.forEach(a=>{let p=$('p','', (a.direction==='pro'?'PRO':a.direction==='contra'?'KONTRA':'OFFEN')+' · '+a.strength+'/5: '+(a.body||'–'));add(second,p);if(a.evidence)add(second,$('p','', 'Beleg / Begründung: '+a.evidence))});add(row,first,second);table.append(row)});root.append(table)}let total=totals();text(root,'Waagenanzeige: Pro '+total.P.toFixed(1)+' / Kontra '+total.C.toFixed(1)+' (subjektive Gewichtungen; kein objektives Ergebnis).');add(root,$('h2','','Meine Antworten auf kritische Rückfragen'));buildQuestions().forEach((x,i)=>safeContent(root,x.type+' · '+x.text,state.answers[i]));add(root,$('h2','','Mein begründetes Sach- und Werturteil'));text(root,state.judgment||'Noch nicht formuliert.');add(root,$('h2','','Mein Rückblick'));text(root,state.change||'—');add(root,$('p','foot','Diese Übersicht gibt die individuellen Eingaben wieder, keine juristische oder politische Bewertung durch die Anwendung. Stand des Quellenhinweises: 18.10.2026.'))}
function report(){heading(5,'Meine Abwägung und mein Ergebnis','Du kannst deine Überlegungen prüfen, ausdrucken oder über die Druckfunktion deines Browsers als PDF speichern.');const {P,C}=totals();add(root,balanceVisual());let result=$('div','report-box');add(result,$('h3','','Mein Urteil'),$('p','position-result',position(state.final)), $('p','',state.judgment||'Du hast noch kein Urteil formuliert. Gehe zu Schritt 5 zurück.'));add(root,result);let changes=$('div','pill');changes.textContent='Ausgangsposition: '+position(state.initial)+' → Schlussposition: '+position(state.final);add(root,changes);add(root,el('div',{class:'hint',text:'Die Waage berücksichtigt deine subjektiven Eingaben. Auch wenn der Ausschlag von deinem Gesamturteil abweicht, darfst du bei deiner Position bleiben – wichtig ist eine gute Begründung.'}));let row=$('div','row');add(row,btn('Als PDF speichern / drucken',()=>{buildPrint();window.print()}),btn('Ergebnis als Text speichern',()=>downloadText()),btn('Alles löschen / neu starten',reset,'btn danger'));add(root,row);add(root,$('h3','','Rechtliche Orientierung und Quellen'));let links=$('ul','tight');[['Grundgesetz – Artikel 21','https://www.gesetze-im-internet.de/gg/art_21.html'],['Bundesverfassungsgericht – NPD-Urteil 2017','https://www.bundesverfassungsgericht.de/SharedDocs/Entscheidungen/DE/2017/01/bs20170117_2bvb000113.html']].forEach(([name,url])=>{let li=$('li');let a=$('a','',name);a.href=url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);links.append(li)});add(root,links);text(root,'Achtung: Diese Anwendung ruft keine aktuellen Nachrichten ab und prüft frei eingegebene Tatsachenbehauptungen nicht automatisch. Aktualisiert eure Wissensgrundlage vor dem Unterricht.','small muted');nav(4,null)}
function downloadText(){let blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Mein_Sach_und_Werturteil.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function reset(){if(!confirm('Alle Eingaben auf dieser Seite löschen und neu beginnen?'))return;state.initial=0;state.final=0;state.criteria=Array.from({length:8},(_,i)=>({type:i<4?'S':'W',name:'',importance:3,arguments:[]}));state.answers=[];state.judgment='';state.change='';go(0)}
function render(){root.replaceChildren();renderProgress();[init,criteria,argumentsScreen,questions,judgment,report][state.step]();}render();
</script>
